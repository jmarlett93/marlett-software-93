  const LOOP = 24, MAX_COLS = 200;
  const COLORS = { bg: '#11161d', bright: [214, 230, 244], dim: [74, 104, 136] };   // navy-charcoal ground, steel-blue dim, ice-blue light

  const tw = TONE.w, th = TONE.h;
  const tone = Uint8Array.from(atob(TONE.data), c => c.charCodeAt(0));
  const sample = (x, y) => {                       // bilinear, clamped, 0..1
    x = Math.max(0, Math.min(tw - 1.001, x)); y = Math.max(0, Math.min(th - 1.001, y));
    const x0 = x | 0, y0 = y | 0, fx = x - x0, fy = y - y0, i = y0 * tw + x0;
    const a = tone[i] + (tone[i + 1] - tone[i]) * fx, b = tone[i + tw] + (tone[i + tw + 1] - tone[i + tw]) * fx;
    return (a + (b - a) * fy) / 255;
  };

  // Swells: [wavelength px, direction deg (travel), cycles per loop, amplitude, phase]. Travel is
  // roughly across the photo's crests (which slope down to the right), so the light bands roll on.
  const SWELLS = [[980, 105, 1, 0.55, 0.0], [610, 72, 1, 0.30, 1.7], [340, 128, 2, 0.15, 4.1]];
  // Heave: [wavelength px, direction deg, cycles per loop, amplitude (fraction of row pitch), phase].
  // Mostly sideways travel, so neighbouring columns sit at different heights and each row ripples.
  const HEAVE = [[560, 8, 1, 0.27, 0.4], [330, 168, 2, 0.13, 2.2], [900, 60, 1, 0.12, 5.0]];
  const WOBBLE = [[720, 95, 1, 16, 0.6], [430, 140, 2, 9, 2.9]]; // refraction: shifts where the photo is read

  function mount(canvas) {
    const ctx = canvas.getContext('2d');
    const intensity = parseFloat(canvas.dataset.intensity || '0.6');
    const S0 = parseFloat(canvas.dataset.scale || '0.5');
    let S, px, py, rB, rD, nudge;
    let W = 0, H = 0, dpr = 1, cells = [];

    function layout() {
      dpr = window.MANUAL ? 1 : Math.min(2, window.devicePixelRatio || 1);
      W = canvas.clientWidth || window.innerWidth; H = canvas.clientHeight || window.innerHeight;
      S = Math.max(S0, W / (19 * MAX_COLS));          // big screens get a bigger lattice, not more dots
      px = 19 * S; py = 36 * S; rB = 6.5 * S; rD = 2.9 * S; nudge = 7 * S;
      canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
      // cover-fit the photo onto the canvas
      const k = Math.max(W / tw, H / th), ox = (W - tw * k) / 2, oy = (H - th * k) / 2;
      cells = [];
      const cols = Math.ceil(W / px) + 1, rows = Math.ceil(H / py) + 1;
      const x0 = (W - (cols - 1) * px) / 2, y0 = (H - (rows - 1) * py) / 2;
      for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {

        const wb = WOBBLE.map(([L, deg]) => { const a = deg * Math.PI / 180; return (x * Math.cos(a) + y * Math.sin(a)) * 2 * Math.PI / L; });
        const hv = HEAVE.map(([L, deg]) => { const a = deg * Math.PI / 180; return (x * Math.cos(a) + y * Math.sin(a)) * 2 * Math.PI / L; });
        cells.push({ x, y, u: (x - ox) / k, v: (y - oy) / k, k: 1 / k, sw, wb, hv, j: Math.sin(c * 12.9898 + r * 78.233) * 43758.5453 % 1 });

    const BUCKETS = 8, TONES = 6, DIM = 0.09, BRIGHT = 0.3;
    const sstep = (e0, e1, x) => { x = Math.max(0, Math.min(1, (x - e0) / (e1 - e0))); return x * x * (3 - 2 * x); };
    function draw(tt) {
      const t = ((tt % LOOP) + LOOP) % LOOP, T = 2 * Math.PI * t / LOOP;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = COLORS.bg; ctx.fillRect(0, 0, W, H);
      // one dot per cell; batch by (tone step, alpha step) so a frame is a few dozen fills
      const paths = Array.from({ length: TONES * BUCKETS }, () => new Path2D());
      const add = (m, a, x, y, r) => {
        const ai = Math.min(BUCKETS - 1, Math.floor(a * BUCKETS)); if (ai <= 0) return;
        const p = paths[Math.min(TONES - 1, Math.round(m * (TONES - 1))) * BUCKETS + ai];
        p.moveTo(x + r, y); p.arc(x, y, r, 0, 2 * Math.PI);
      };

        let dx = 0, dy = 0;
        for (let i = 0; i < WOBBLE.length; i++) {
          const [, deg, n, amp, ph] = WOBBLE[i], s = Math.sin(cell.wb[i] - n * T + ph) * amp;
          dx += s * Math.cos(deg * Math.PI / 180 + 1.2); dy += s * Math.sin(deg * Math.PI / 180 + 1.2);
        }
        const base = sample(cell.u + dx * cell.k, cell.v + dy * cell.k);
        let swell = 0;
        for (let i = 0; i < SWELLS.length; i++) { const [, , n, amp, ph] = SWELLS[i]; swell += amp * Math.sin(cell.sw[i] - n * T + ph); }
        const crest = Math.max(0, swell);                              // light catches the rising faces
        const shimmer = 1 - 0.06 * (0.5 + 0.5 * Math.sin(T * 3 + cell.j * 6.283));
        const v = (base * (0.62 + 0.55 * swell) + 0.10 * crest * crest) * shimmer;
        // soft thresholds: a dot fades in as a dim dot, then morphs (size, tone, nudge) into a bright one
        const a = sstep(DIM - 0.05, DIM + 0.03, v);
        if (a <= 0) continue;
        const m = sstep(BRIGHT - 0.07, BRIGHT + 0.07, v);           // 0 = dim dot, 1 = bright dot
        const w = sstep(0.8, 0.95, v);                               // rare white highlight
        let bob = 4 * S * swell;                                   // dots rise a hair on the crests
        for (let i = 0; i < HEAVE.length; i++) { const [, , n, amp, ph] = HEAVE[i]; bob += amp * py * Math.sin(cell.hv[i] - n * T + ph); }
        add(m, a, cell.x, cell.y + nudge * (1 - m) - bob, (rD + (rB - rD) * m) * (1 + 0.15 * w));
